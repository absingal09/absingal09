name: Paint a pixel

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: canvas
  cancel-in-progress: false

jobs:
  paint:
    # Ignore any issue that isn't from the "Paint a pixel" form.
    if: contains(github.event.issue.labels.*.name, 'pixel')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1

      # ubuntu-latest ships python3 — no setup-python step (saves ~5s/run).

      - name: Write issue body to a file
        # Via env, never string-interpolated into the shell: an issue body with
        # backticks or $(...) would otherwise be a shell injection.
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: printf '%s' "$ISSUE_BODY" > body.txt

      - name: Paint the pixel
        id: paint
        env:
          ISSUE_USER: ${{ github.event.issue.user.login }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set +e
          OUT=$(python3 scripts/paint.py \
            --issue-body-file body.txt \
            --user "$ISSUE_USER" \
            --issue-number "$ISSUE_NUMBER")
          CODE=$?
          set -e
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          {
            echo "message<<PAINT_EOF"
            echo "$OUT"
            echo "PAINT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.paint.outputs.code == '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add canvas.json canvas.png README.md
          git commit -m "Paint pixel (issue #${{ github.event.issue.number }})"
          git pull --rebase --autostash
          git push

      - name: Comment success and close
        if: steps.paint.outputs.code == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          MESSAGE: ${{ steps.paint.outputs.message }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          BRANCH: ${{ github.event.repository.default_branch }}
          RUN: ${{ github.run_number }}
        run: |
          {
            printf '%s\n\n' "$MESSAGE"
            printf '![canvas](https://raw.githubusercontent.com/%s/%s/%s/canvas.png?v=%s)\n\n' \
              "$OWNER" "$REPO" "$BRANCH" "$RUN"
            printf '_The image on the profile page can take 1–3 minutes to catch up (GitHub caching) — hard-refresh if it looks stale._\n'
          } > comment.md
          gh issue comment "${{ github.event.issue.number }}" --body-file comment.md
          gh issue close "${{ github.event.issue.number }}" --reason completed

      - name: Comment failure and close
        if: steps.paint.outputs.code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          MESSAGE: ${{ steps.paint.outputs.message }}
        run: |
          printf '%s\n\nOpen a new issue from the **Paint a pixel** template to try again.\n' \
            "$MESSAGE" > comment.md
          gh issue comment "${{ github.event.issue.number }}" --body-file comment.md
          gh issue close "${{ github.event.issue.number }}" --reason "not planned"
